services:
  web:
    image: node:24-bookworm-slim
    build: !reset null
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    environment:
      DOCKER_DEV: "true"   
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports: !override
      - "5173:5173"
    volumes:
      - .:/workspace       
      - planix_node_modules:/workspace/node_modules

volumes:
  planix_node_modules:
