server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Os anexos vao ate 10MB (spring.servlet.multipart.max-file-size).
    # O default do nginx e 1m e cortaria o upload antes de chegar no backend.
    client_max_body_size 12m;

    # DNS interno do Docker. Com o upstream numa variavel, o nginx resolve
    # "app" a cada request em vez de na subida, entao este container sobe
    # mesmo que o backend ainda nao esteja de pe.
    resolver 127.0.0.11 valid=10s;

    # Precisa vir antes do "location /", senao o try_files devolveria o HTML
    # da SPA para as rotas de API.
    location /api/ {
        set $planix_api http://app:8080;
        # O $request_uri e obrigatorio: quando o proxy_pass usa variavel, o
        # nginx nao faz a substituicao normal da URI.
        proxy_pass $planix_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
